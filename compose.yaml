services:
  postgres:
    image: postgres
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grievance_track

    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass redis

    environment:
      REDIS_PASSWORD: redis

    ports:
      - "6379:6379"
